<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script>(function(){var h=false;var re=/(?:^|;\s*)__client_uat[^=]*=([^;]*)/g;var m;while((m=re.exec(document.cookie))){if(m[1]&&m[1]!=='0'){h=true;break}}document.documentElement.setAttribute('data-auth',h?'member':'guest');})();</script>
    <!-- ye:favicon:start -->
    <link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#FFFAF3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ゆっくりエクソ">
    <meta property="og:image" content="../icons/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="../icons/og-image.jpg">
    <!-- ye:favicon:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>用語集 | ゆっくりエクソソーム</title>
    <meta name="description" content="エクソソームに関する専門用語をキャラがやさしく解説する用語集。検索・カテゴリ別フィルタで知りたい用語をすぐに見つけられます。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"></noscript>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/glossary.css">
</head>
<body>
    <main>
        <section class="section">
            <div class="container container--narrow">
                <h1 class="section__title">📖 用語集</h1>
                <p class="section__subtitle">専門用語をキャラがやさしく解説</p>

                <div class="glossary">
                    <!-- 検索 -->
                    <div class="glossary__search">
                        <span class="glossary__search-icon">🔍</span>
                        <input
                            type="text"
                            class="glossary__search-input"
                            id="glossary-search"
                            placeholder="用語を検索（例：エクソソーム、培養上清液）"
                            autocomplete="off"
                        >
                    </div>

                    <!-- フィルタ -->
                    <div class="glossary__filters" id="glossary-filters"></div>

                    <!-- 件数 -->
                    <div class="glossary__count" id="glossary-count"></div>

                    <!-- リスト -->
                    <div class="glossary__list" id="glossary-list"></div>
                </div>

                <div class="article__note" style="margin-top: 32px;">
                    <strong>💡 使い方</strong><br>
                    ・上部の検索ボックスに用語を入力すると、リアルタイムで絞り込まれます<br>
                    ・カテゴリボタンで分野ごとに絞り込めます<br>
                    ・用語をタップすると詳しい解説が開きます<br>
                    ・関連用語のタグをタップすると、その用語にジャンプします
                </div>
            </div>
        </section>
    </main>

    <script defer src="../js/common.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/auth-mode.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/glossary.js"></script>
    <script>document.addEventListener('DOMContentLoaded', function () { injectAppShell('me', 1); });</script>
</body>
</html>
