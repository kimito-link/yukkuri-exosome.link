<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- ye:favicon:start -->
    <link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#c9899a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ゆっくりエクソ">
    <meta property="og:image" content="../icons/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="../icons/og-image.jpg">
    <!-- ye:favicon:end -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セルフケアチェッカー | ゆっくりエクソソーム</title>
    <meta name="description" content="今日のセルフケアをチェックして、あなたのエクソソーム活性度を見える化。ゆっくり3人組から応援メッセージも。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/selfcare.css">
    <link rel="stylesheet" href="../css/bodymap.css">
</head>
<body>
    <main class="app-screen">
        <header class="today-greeting">
            <div class="today-greeting__date">Daily Signal</div>
            <div class="today-greeting__hello" style="font-size: 1.2rem;">本日の体内エクソソーム</div>
        </header>

        <p class="selfcare__date" id="selfcare-date" style="text-align:center; margin-bottom: 8px;">今日</p>
        <div style="text-align:center; margin-bottom: 16px;">
            <span class="selfcare__streak" id="selfcare-streak" style="display:none;"></span>
        </div>

        <!-- 体内マップ -->
        <div id="selfcare-bodymap"></div>

        <!-- フィードバック（キャラからのコメント） -->
        <div class="selfcare__feedback" id="selfcare-feedback"></div>

        <!-- ケア項目 -->
        <h2 class="app-section-title">
            <span class="app-section-title__emoji">🌿</span>
            今日のシグナル送信
        </h2>
        <div class="selfcare__items" id="selfcare-items"></div>

        <!-- 履歴 -->
        <h2 class="app-section-title">
            <span class="app-section-title__emoji">📅</span>
            この1週間
        </h2>
        <div class="selfcare__history">
            <div class="selfcare__history-grid" id="selfcare-history-grid"></div>
            <p style="font-size:0.75rem; color: var(--color-text-muted); margin-top: 12px; line-height: 1.6; letter-spacing: 0.02em;">
                ※ 半数以上達成で活性日にカウント。連続するとシグナル送信日数が伸びます。
            </p>
        </div>

        <div class="article__note" style="margin: 24px 16px 0; font-size: 0.78rem; line-height: 1.7;">
            <strong>📌 ご注意</strong><br>
            これは医療診断ではなく、エクソソーム研究の知見を参考に、毎日のセルフケアを楽しく可視化したものです。生成量の数字や活性表示は習慣化のきっかけとしてのイメージで、実際の体内エクソソーム測定値ではありません。
        </div>
    </main>

    <script src="../js/common.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/bodymap.js"></script>
    <script src="../js/selfcare.js"></script>
    <script>injectAppShell('care', 1);</script>
</body>
</html>
