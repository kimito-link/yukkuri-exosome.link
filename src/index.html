<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- ye:favicon:start -->
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#c9899a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ゆっくりエクソ">
    <!-- iOS Safari 純正スマートアプリバナー（Safari以外は無視。Capacitorアプリ内では作用しない） -->
    <meta name="apple-itunes-app" content="app-id=6775201794, app-argument=https://yukkuri-exosome.link/">
    <meta property="og:image" content="icons/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="icons/og-image.jpg">
    <!-- ye:favicon:end -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kimito-Linkのゆっくりエクソソーム — 3人組と毎日セルフケア</title>
    <meta name="description" content="Kimito-Linkのゆっくりエクソソーム。ゆっくり3人組「りんく・こん太・たぬ姉」と毎日のセルフケアを積み上げるアプリ。レベル・ストリーク・育成で、習慣化が楽しくなる。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kimito-Linkのゆっくりエクソソーム">
    <meta property="og:description" content="ゆっくり3人組と毎日ちょっとずつ、セルフケア。エクソソームを楽しく学べるアプリ。">
    <meta property="og:url" content="https://yukkuri-exosome.link/">
    <meta property="og:site_name" content="ゆっくりエクソソーム">
    <meta name="twitter:title" content="Kimito-Linkのゆっくりエクソソーム">
    <meta name="twitter:description" content="ゆっくり3人組と毎日ちょっとずつ、セルフケア">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/bodymap.css">
    <link rel="stylesheet" href="css/boost.css">
</head>
<body>
    <main id="today-screen"></main>

    <script src="js/common.js"></script>
    <script src="js/app.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/bodymap.js"></script>
    <script src="js/boost.js"></script>
    <script src="js/ueda-quotes.js"></script>
    <script src="js/skincheck.js"></script>
    <script src="js/doctormemo.js"></script>
    <script src="js/reminder.js"></script>
    <script src="js/photolog.js"></script>
    <script src="js/fatigue.js"></script>
    <script src="js/sleep.js"></script>
    <script src="js/refpartner.js"></script>
    <script src="js/premium.js"></script>
    <script src="js/mindcare.js"></script>
    <script src="js/longevity.js"></script>
    <script>
        // Today画面を構築
        (function() {
            const lv = App.getLevel();
            const streak = App.getStreak();
            const quests = App.getTodayQuests();
            const mood = App.getMoodCharacter();
            const moodChar = CHARACTERS[mood.charKey];
            const moodImg = getImagePath(mood.charKey, mood.expression, 0);

            const totalDays = YEStorage.get('app_total_days', 0);
            const lastDate = YEStorage.get('app_last_active', null);
            const today = getTodayKey();
            if (lastDate === today) {
                // total daysカウント
                const counted = YEStorage.get('app_total_days_counted', null);
                if (counted !== today) {
                    YEStorage.set('app_total_days', totalDays + 1);
                    YEStorage.set('app_total_days_counted', today);
                }
            }

            const adviceCount = YEStorage.get('advice_count', 0);
            const quizBest = YEStorage.get('quiz_best', 0);

            const allQuestsDone = quests.care.done && quests.quiz.done && quests.advice.done;

            // Boost状態を先に取得（htmlテンプレート内で参照するため）
            const boostData = getBoostActiveData();

            const greeting = (() => {
                const h = new Date().getHours();
                if (h < 5) return '🌙 こんばんは';
                if (h < 11) return '☀️ おはよう';
                if (h < 17) return '🌤 こんにちは';
                return '🌙 こんばんは';
            })();

            const html = `
                <div class="app-screen">
                    <!-- ブランドヒーロー（エディトリアル） -->
                    <div class="brand-hero">
                        <!-- 背景にキャラ控えめ -->
                        <img src="images/characters/link/link-yukkuri-smile-mouth-closed.png" alt="" class="brand-hero__char-bg brand-hero__char-bg--rink">
                        <img src="images/characters/konta/kitsune-yukkuri-smile-mouth-closed.png" alt="" class="brand-hero__char-bg brand-hero__char-bg--konta">
                        <img src="images/characters/tanunee/tanuki-yukkuri-smile-mouth-closed.png" alt="" class="brand-hero__char-bg brand-hero__char-bg--tanunee">

                        <div class="brand-hero__top">
                            <a href="https://kimito-link.com/" target="_blank" rel="noopener" class="brand-hero__logo-link">
                                <img src="images/kimito-link-logo/logo_kimito-link_RGB_color.png" alt="Kimito-Link" class="brand-hero__logo">
                            </a>
                            <div class="brand-hero__divider"></div>
                            <div class="brand-hero__sub">
                                Presents
                                <span class="brand-hero__sub-jp">A Daily Ritual</span>
                            </div>
                        </div>
                        <h1 class="brand-hero__title">ゆっくり<em>エクソソーム</em></h1>
                        <div class="brand-hero__divider-line"></div>
                        <p class="brand-hero__tagline">毎日、ちいさなセルフケアを、ていねいに</p>
                    </div>

                    <!-- あいさつ -->
                    <header class="today-greeting">
                        <div class="today-greeting__date">${formatDateJp()}</div>
                        <div class="today-greeting__hello">${greeting}<br><small>今日もゆっくり始めよう</small></div>
                    </header>

                    <!-- 3人組ヒーロー -->
                    <div class="top-trio">
                        <a href="characters/" class="top-trio__member top-trio__member--rink">
                            <img src="images/characters/link/link-yukkuri-smile-mouth-open.png" alt="りんく">
                            <span class="top-trio__name">りんく</span>
                        </a>
                        <a href="characters/" class="top-trio__member top-trio__member--konta">
                            <img src="images/characters/konta/kitsune-yukkuri-smile-mouth-open.png" alt="こん太">
                            <span class="top-trio__name">こん太</span>
                        </a>
                        <a href="characters/" class="top-trio__member top-trio__member--tanunee">
                            <img src="images/characters/tanunee/tanuki-yukkuri-smile-mouth-open.png" alt="たぬ姉">
                            <span class="top-trio__name">たぬ姉</span>
                        </a>
                    </div>

                    <!-- 体内マップ -->
                    <div id="today-bodymap"></div>

                    <!-- ロンジェビティ・スコア（擬似・体内細胞年齢） -->
                    <div id="today-longevity"></div>

                    <!-- 上田先生の今日の検証 -->
                    <div id="today-ueda"></div>

                    <!-- 次回ブースト予定リマインダー -->
                    <div id="today-reminder"></div>

                    <!-- 肌セルフチェック -->
                    <div id="today-skin"></div>

                    <!-- 睡眠ログ（時計いらず・タップ記録） -->
                    <div id="today-sleep"></div>

                    <!-- 心と社会のケア（つながり・生きがい） -->
                    <div id="today-mindcare"></div>

                    <!-- 疲労回復度チェック（院長リクエスト） -->
                    <div id="today-fatigue"></div>

                    <!-- 院長への質問メモ -->
                    <div id="today-memo"></div>

                    <!-- ビフォーアフター写真記録 -->
                    <div id="today-photo"></div>

                    <!-- キャラからのひとこと -->
                    <div class="today-char-card">
                        <div class="today-char-card__img">
                            <img src="${moodImg}" alt="${moodChar.name}">
                        </div>
                        <div class="today-char-card__content">
                            <div class="today-char-card__name" style="color:${moodChar.color}">${moodChar.name.toUpperCase ? moodChar.name : moodChar.name}</div>
                            <div class="today-char-card__message">${mood.message}</div>
                        </div>
                        <div class="today-char-card__friends">
                            ${['rink', 'konta', 'tanunee'].filter(k => k !== mood.charKey).map(k => `
                                <div class="today-char-card__friend">
                                    <img src="${getImagePath(k, 'normal', 0)}" alt="${CHARACTERS[k].name}">
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 統計 -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-card__emoji">🔥</div>
                            <div class="stat-card__value">${streak}</div>
                            <div class="stat-card__label">連続日数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__emoji">⭐</div>
                            <div class="stat-card__value">${lv.lv}</div>
                            <div class="stat-card__label">レベル</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__emoji">✨</div>
                            <div class="stat-card__value">${lv.ep}</div>
                            <div class="stat-card__label">EP</div>
                        </div>
                    </div>

                    <!-- 今日のクエスト -->
                    <h2 class="app-section-title">
                        <span class="app-section-title__emoji">🎯</span>
                        今日のクエスト
                        ${allQuestsDone ? '<span style="margin-left:auto; color:#4caf50; font-size:0.75rem;">✓ コンプリート</span>' : ''}
                    </h2>

                    <div class="quest-list">
                        <a href="selfcare/" class="quest-card ${quests.care.done ? 'quest-card--done' : ''}">
                            <div class="quest-card__icon">
                                <img src="images/characters/konta/kitsune-yukkuri-smile-mouth-open.png" alt="こん太">
                            </div>
                            <div class="quest-card__content">
                                <div class="quest-card__title">本日のシグナル送信</div>
                                <div class="quest-card__desc">${quests.care.done ? `体内エクソ活性 完了` : `あと${Math.max(0, 3 - quests.care.progress)}項目で活性化 (${quests.care.progress} / 6)`}</div>
                                <span class="quest-card__reward">+ 30 EP</span>
                            </div>
                            <div class="quest-card__arrow">${quests.care.done ? '✓' : '→'}</div>
                        </a>

                        <a href="quiz/" class="quest-card ${quests.quiz.done ? 'quest-card--done' : ''}">
                            <div class="quest-card__icon">
                                <img src="images/characters/tanunee/tanuki-yukkuri-smile-mouth-open.png" alt="たぬ姉">
                            </div>
                            <div class="quest-card__content">
                                <div class="quest-card__title">本日のミニ知識</div>
                                <div class="quest-card__desc">${quests.quiz.done ? `${quests.quiz.correct} / 3 正解` : `3問チャレンジ (${quests.quiz.progress} / 3)`}</div>
                                <span class="quest-card__reward">+ 20 EP × 3</span>
                            </div>
                            <div class="quest-card__arrow">${quests.quiz.done ? '✓' : '→'}</div>
                        </a>

                        <a href="boost/" class="quest-card">
                            <div class="quest-card__icon">
                                <img src="images/characters/link/link-yukkuri-smile-mouth-open.png" alt="りんく">
                            </div>
                            <div class="quest-card__content">
                                <div class="quest-card__title">本日のブースト</div>
                                <div class="quest-card__desc">${boostData.items.length > 0 ? `${boostData.items.length}件の記録 (+${boostData.totalBonus.toLocaleString()}粒)` : '点滴・サプリの記録'}</div>
                                <span class="quest-card__reward">+ ボーナス粒子</span>
                            </div>
                            <div class="quest-card__arrow">${boostData.items.length > 0 ? '✓' : '→'}</div>
                        </a>

                        <a href="advice/" class="quest-card ${quests.advice.done ? 'quest-card--done' : ''}">
                            <div class="quest-card__icon">
                                <img src="images/characters/link/link-yukkuri-smile-mouth-open.png" alt="りんく">
                            </div>
                            <div class="quest-card__content">
                                <div class="quest-card__title">今日のひとこと</div>
                                <div class="quest-card__desc">${quests.advice.done ? 'メッセージ受け取り済み' : '3人組から今日のひとこと'}</div>
                                <span class="quest-card__reward">+ 10 EP</span>
                            </div>
                            <div class="quest-card__arrow">${quests.advice.done ? '✓' : '→'}</div>
                        </a>
                    </div>

                    <!-- もっと知る（記事） -->
                    <h2 class="app-section-title">
                        <span class="app-section-title__emoji">📚</span>
                        ちょっと寄り道
                    </h2>

                    <div class="quest-list">
                        <a href="glossary/" class="quest-card">
                            <div class="quest-card__icon" style="background: linear-gradient(135deg, #d8f3ff, #ffe4ec);">📖</div>
                            <div class="quest-card__content">
                                <div class="quest-card__title">用語集</div>
                                <div class="quest-card__desc">専門用語をキャラがやさしく解説</div>
                            </div>
                            <div class="quest-card__arrow">→</div>
                        </a>
                        <a href="basics/what-is-exosome/" class="quest-card">
                            <div class="quest-card__icon" style="background: linear-gradient(135deg, #fff0d6, #f4e8d8);">🧬</div>
                            <div class="quest-card__content">
                                <div class="quest-card__title">エクソソームって何？</div>
                                <div class="quest-card__desc">入門の入門。3分で読めるよ</div>
                            </div>
                            <div class="quest-card__arrow">→</div>
                        </a>
                        <a href="basics/ueda-philosophy/" class="quest-card">
                            <div class="quest-card__icon" style="background: linear-gradient(135deg, #f4ede4, #ebe0d0);">📚</div>
                            <div class="quest-card__content">
                                <div class="quest-card__title">上田実先生が見ているもの</div>
                                <div class="quest-card__desc">30年の研究の根っこにある思想</div>
                            </div>
                            <div class="quest-card__arrow">→</div>
                        </a>
                    </div>

                    <!-- アプリダウンロード（Webのみ表示。Capacitorアプリ内では非表示） -->
                    ${(typeof window !== 'undefined' && window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ? '' : (function() {
                        const APPLE = 'https://apps.apple.com/jp/app/id6775201794';
                        const PLAY = 'https://play.google.com/store/apps/details?id=com.kimito.link.yukkuriexosome';
                        const ua = (navigator.userAgent || '');
                        const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                        const isAndroid = /Android/.test(ua);
                        // 公式バッジ（Apple: 日本語「App Storeで入手」 / Google: 日本語「Google Playで手に入れよう」）
                        const appleBadge = `<a href="${APPLE}" target="_blank" rel="noopener" class="store-badge" aria-label="App Storeで入手"><img src="images/store-badges/apple-appstore-ja.svg" alt="App Storeで入手"></a>`;
                        const playBadge = `<a href="${PLAY}" target="_blank" rel="noopener" class="store-badge" aria-label="Google Playで手に入れよう"><img src="images/store-badges/google-play-ja.png" alt="Google Playで手に入れよう"></a>`;
                        // デバイス出し分け：iOSはApp Storeのみ／AndroidはPlayのみ／PC等は両方
                        let badges, note;
                        if (isIOS) { badges = appleBadge; note = ''; }
                        else if (isAndroid) { badges = playBadge; note = ''; }
                        else { badges = appleBadge + playBadge; note = '<p class="app-download__note">スマホで開くと、お使いの端末に合ったストアが表示されます</p>'; }
                        return `
                    <div class="app-download">
                        <div class="app-download__chip">Download</div>
                        <h2 class="app-download__title">アプリでもっとゆっくり</h2>
                        <p class="app-download__lead">iPhone・Android アプリをリリースしました。<br>毎日のセルフケアを、もっと手軽に。完全無料・登録不要。</p>
                        <div class="app-download__badges">${badges}</div>
                        ${note}
                    </div>
                    `;
                    })()}

                    <!-- ロゴ控えめ表示 -->
                    <div style="text-align: center; margin: 32px 0 16px; opacity: 0.6;">
                        <a href="https://kimito-link.com/" target="_blank" rel="noopener" style="display: inline-block;">
                            <img src="images/kimito-link-logo/logo_kimito-link_RGB_color.png" alt="Kimito-Link" style="height: 32px; width: auto;">
                        </a>
                    </div>
                </div>
            `;

            document.getElementById('today-screen').innerHTML = html;
            injectAppShell('today', 0);

            // 体内マップを描画（セルフケア + Boost両方）
            const todayCareData = YEStorage.get(`selfcare_${today}`, []);
            const combined = new Set([...todayCareData, ...boostData.activeRegions]);
            renderBodyMap('today-bodymap', combined, 0);

            // NMNを取った日はミトコンドリア演出
            if (boostData.hasMito) {
                setTimeout(() => {
                    const svg = document.querySelector('#today-bodymap .bodymap');
                    if (!svg) return;
                    const ns = 'http://www.w3.org/2000/svg';
                    const group = document.createElementNS(ns, 'g');
                    group.setAttribute('class', 'bodymap__mitochondria-group');
                    const positions = [
                        [60, 60], [140, 60], [80, 120], [120, 120],
                        [70, 140], [130, 140], [90, 170], [110, 170],
                        [60, 200], [140, 200], [80, 230], [120, 230],
                        [76, 260], [124, 260], [80, 290], [120, 290],
                        [100, 110], [100, 145], [50, 180], [150, 180]
                    ];
                    positions.forEach((pos, i) => {
                        const star = document.createElementNS(ns, 'circle');
                        star.setAttribute('cx', pos[0]);
                        star.setAttribute('cy', pos[1]);
                        star.setAttribute('r', 1.6);
                        star.setAttribute('class', 'bodymap__star is-active');
                        star.style.animationDelay = (i * 0.18) + 's';
                        group.appendChild(star);
                    });
                    svg.appendChild(group);
                }, 200);
            }

            // 上田先生の今日の検証カードを描画
            (function renderUedaCard() {
                const q = getUedaQuoteOfDay();
                const char = CHARACTERS[q.char];
                const charImg = getImagePath(q.char, 'smileOpen', 0);
                document.getElementById('today-ueda').innerHTML = `
                    <div class="ueda-card" style="background:linear-gradient(135deg,#fff,#f7f0e8); border-radius:22px; padding:22px 20px 20px; box-shadow:0 4px 20px rgba(46,38,34,.06); margin-bottom:20px; border-left:3px solid #a78a6b;">
                        <div class="ueda-card__chip" style="display:inline-block; font-family:'Noto Serif JP',serif; font-size:.65rem; letter-spacing:.28em; color:#8a7d76; text-transform:uppercase; margin-bottom:10px;">Today's Wisdom<span class="ueda-card__topic" style="display:inline-block; margin-left:8px; padding:2px 10px; background:rgba(167,138,107,.12); color:#a78a6b; border-radius:999px; font-size:.7rem; font-weight:600; letter-spacing:.08em; text-transform:none;">${q.topic}</span></div>
                        <div class="ueda-card__body" style="display:flex; gap:14px; align-items:flex-start;">
                            <div class="ueda-card__avatar" style="width:60px; height:60px; flex:0 0 60px; border-radius:50%; background:#f4ede4; overflow:hidden; display:flex; align-items:center; justify-content:center;">
                                <img src="${charImg}" alt="${char.name}" style="width:100%; height:100%; object-fit:contain; display:block;">
                            </div>
                            <div class="ueda-card__content" style="flex:1; min-width:0;">
                                <div class="ueda-card__quote" style="font-family:'Noto Serif JP',serif; font-size:.95rem; font-weight:500; line-height:1.75; color:#2e2622; margin-bottom:10px;">${q.text}</div>
                                <div class="ueda-card__source" style="font-size:.68rem; color:#8a7d76; line-height:1.5; padding-top:6px; border-top:1px dashed #ebe0d0;">— 上田 実『改訂版 驚異の再生医療 〜培養上清が世界を救う〜』扶桑社新書 (2022) より</div>
                            </div>
                        </div>
                        <div class="ueda-card__actions" style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
                            <div class="ueda-card__day" style="font-size:.7rem; color:#8a7d76; letter-spacing:.08em;">${q.index + 1} / ${q.total}</div>
                            <button class="ueda-card__share" id="ueda-share-btn" style="background:transparent; border:1px solid #ebe0d0; color:#8a7d76; padding:4px 12px; border-radius:999px; font-family:'Noto Serif JP',serif; font-size:.7rem; letter-spacing:.1em; cursor:pointer;">シェア</button>
                        </div>
                    </div>
                `;
                document.getElementById('ueda-share-btn').addEventListener('click', () => {
                    const txt = `【今日の上田先生の検証】\n\n${q.text}\n\n— 上田実『驚異の再生医療』より\n\nhttps://yukkuri-exosome.link/`;
                    if (navigator.share) {
                        navigator.share({ text: txt }).catch(() => {});
                    } else if (navigator.clipboard) {
                        navigator.clipboard.writeText(txt).then(() => alert('コピーしました'));
                    }
                });
            })();

            // 次回ブースト予定リマインダー
            renderNextReminder('today-reminder');

            // 肌セルフチェック
            renderSkinCheck('today-skin');

            // 睡眠ログ（時計いらず・タップ記録）
            renderSleepLog('today-sleep');

            // 心と社会のケア（つながり・生きがい）
            renderMindCare('today-mindcare');

            // ロンジェビティ・スコア（擬似・体内細胞年齢）
            renderLongevityScore('today-longevity');

            // 医師紹介コードで来た人への歓迎バー（初回のみ・app-screen 構築後に呼ぶ）
            if (typeof RefPartner !== 'undefined' && RefPartner.showWelcomeOnce) RefPartner.showWelcomeOnce();

            // 疲労回復度チェック（院長リクエスト）
            renderFatigueCheck('today-fatigue');

            // 院長への質問メモ
            renderDoctorMemo('today-memo');

            // ビフォーアフター写真記録（非同期）
            renderPhotoLog('today-photo').catch((err) => {
                console.error('Photo Log failed:', err);
            });

            // 初回起動時にオンボーディングを表示
            autoShowOnboardingIfNeeded(0);
        })();
    </script>
</body>
</html>
