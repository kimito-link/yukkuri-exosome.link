    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひとことアドバイス | ゆっくりエクソソーム</title>
    <meta name="description" content="ボタンひとつで、3人組の誰かが今日のひとことをくれる！食事・運動・知識のアドバイスをランダムに楽しめます。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/advice.css">
</head>
<body>
    <main>
        <section class="section">
            <div class="container container--narrow">
                <h1 class="section__title">💬 ひとことアドバイス</h1>
                <p class="section__subtitle">3人組から今日のひとことが届きます</p>

                <div class="advice">
                    <div class="advice__card" id="advice-card"></div>

                    <div class="advice__actions">
                        <button class="btn btn--primary" id="advice-next">
                            🎲 もう一度引く
                        </button>
                        <button class="advice__share" id="advice-share">
                            📤 シェアする
                        </button>
                    </div>

                    <div class="advice__counter" id="advice-counter"></div>
                </div>

                <div class="article__note" style="margin-top: 32px;">
                    <strong>💡 使い方</strong><br>
                    ・ボタンを押すたびに、3人組の中からランダムにひとことが届きます<br>
                    ・食事・運動・健康・豆知識など、いろんなカテゴリの内容があります<br>
                    ・気に入ったアドバイスはシェアボタンで共有できます
                </div>

                <div class="article__note" style="background: #e8f5e9; border-left-color: #4caf50;">
                    <strong>🌱 こんな使い方も</strong><br>
                    朝の準備中・通勤前・お昼休みなど、ちょっとした隙間時間に。「今日はこれを意識してみよう」というきっかけにしてみてください。
                </div>
            </div>
        </section>
    </main>

    <script src="../js/common.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/advice.js"></script>
    <script>injectAppShell('care', 1);</script>
</body>
