# Google Play 申請用ワークフロー（partnership_program_website 移植版）
#
# - `android-twa/` の TWA プロジェクトを `bundleRelease` でビルドし、Service Account 経由で
#   Play Console に AAB をアップロードして指定トラックにリリースを作成する。
# - 初期トラックは `internal`（内部テスト）。問題なければ `production` に切替。
#
# 必要な Secrets:
#     ANDROID_KEYSTORE_BASE64        - android-twa/android-upload-key.jks を base64 化
#     ANDROID_KEYSTORE_PROPERTIES    - keystore.properties の中身そのもの
#     GOOGLE_PLAY_SA_JSON_BASE64     - Service Account JSON を base64 化
#                                       SAは fujisan-compass の既存SAに権限追加するか、新規発行
name: android-play-release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal / closed / production)"
        required: false
        default: "internal"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-play-release.yml"
      - "android-twa/app/build.gradle"
      - "android-twa/twa-manifest.json"
      - "release-notes/CURRENT-ja.txt"
      - "scripts/play-publish.mjs"
      - "scripts/lib/play-api.mjs"
      - "store-assets/play/**"
      - "app.config.json"

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_PACKAGE_NAME: com.kimito.link.yukkuriexosome
      # production: 製品版審査キューに入る
      # internal:   内部テストトラック
      # closed:     クローズドテスト
      PLAY_TRACK: ${{ inputs.track || 'internal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PROPERTIES GOOGLE_PLAY_SA_JSON_BASE64; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-twa/android-upload-key.jks
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > android-twa/keystore.properties

      - name: Verify build.gradle has signingConfig
        run: |
          set -euo pipefail
          gradle="android-twa/app/build.gradle"
          if ! grep -q "signingConfigs" "$gradle"; then
            echo "ERROR: $gradle is missing 'signingConfigs' block."
            echo "The AAB will not be signed and Play Console will reject it."
            echo "Add signingConfigs { release { storeFile / storePassword / keyAlias / keyPassword } }"
            echo "and set 'signingConfig signingConfigs.release' inside buildTypes.release."
            exit 1
          fi
          if ! grep -A20 "buildTypes" "$gradle" | grep -q "signingConfig signingConfigs.release"; then
            echo "ERROR: buildTypes.release in $gradle does not reference signingConfig."
            echo "Add: signingConfig signingConfigs.release"
            exit 1
          fi
          echo "signingConfig check: OK"

      - name: Build release AAB
        working-directory: android-twa
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          ls -l app/build/outputs/bundle/release/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Restore Service Account JSON
        env:
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets
          printf '%s' "$GOOGLE_PLAY_SA_JSON_BASE64" | base64 -d > .secrets/google-play-sa.json
          node -e "JSON.parse(require('fs').readFileSync('.secrets/google-play-sa.json','utf8')); console.log('SA JSON parsed OK')"

      - name: Publish to Play Console (uses $PLAY_TRACK)
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_AAB_PATH: android-twa/app/build/outputs/bundle/release/app-release.aab
        run: node scripts/play-publish.mjs

      # ★アップロード後に、配布される署名が assetlinks.json に載っているか確かめる。
      #   載っていないと実機で TWA のアドレスバーが出る。
      #   ここで落ちてもアップロード自体は済んでいるので、assetlinks.json を直して
      #   デプロイすれば復旧できる（APKの作り直しは不要）。
      #   ★generatedApks はアップロード済みでないと取れないので、公開の「後」に置く。
      - name: Verify TWA signing vs assetlinks
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
        run: node scripts/play-check-signing.mjs

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .secrets/google-play-sa.json
          rm -f android-twa/android-upload-key.jks
          rm -f android-twa/keystore.properties
