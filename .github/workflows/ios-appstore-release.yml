# iOS App Store 申請用ワークフロー（partnership_program_website 移植版）
#
# - macOS-latest ランナー上で Capacitor + Xcode で IPA を作成し、App Store Connect API で
#   ビルドを TestFlight にアップロード + メタデータを書き込んで審査提出まで自動化する。
# - Mac は不要（GitHub Actions の macos-latest が代行）。プライベート repo は ~$2-3/release。
# - 「リモート読込型」(server.url=https://yukkuri-exosome.link) なので
#   www/ には index.html プレースホルダだけ置けば動く。
#
# 必要な Secrets（Repo Settings → Secrets and variables → Actions）:
#     APPLE_TEAM_ID                       (= 8922HQ842P)
#     APPSTORE_CONNECT_KEY_ID
#     APPSTORE_CONNECT_ISSUER_ID
#     APPSTORE_CONNECT_API_KEY_P8_BASE64
#     IOS_DIST_CERT_PASSWORD
#     IOS_DIST_CERT_P12_BASE64    (or both IOS_DIST_CERT_CER_BASE64 + IOS_DIST_PRIVATE_KEY_PEM_BASE64)
#     IOS_APPSTORE_PROFILE_BASE64
name: ios-appstore-release

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-appstore-release.yml"
      - "capacitor.config.ts"
      - "src/**"
      - "package.json"
      - "scripts/appstore-submit.mjs"
      - "scripts/lib/asc-api.mjs"
      - "scripts/lib/asc-screenshot-upload.mjs"
      - "store-assets/appstore/**"
      - "release-notes/CURRENT-ja.txt"
      - "app.config.json"

concurrency:
  group: ios-appstore-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-ios-build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APP_BUNDLE_ID: com.kimito.link.yukkuriexosome
      APP_NAME: YukkuriExosome
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_CER_BASE64: ${{ secrets.IOS_DIST_CERT_CER_BASE64 }}
      IOS_DIST_PRIVATE_KEY_PEM_BASE64: ${{ secrets.IOS_DIST_PRIVATE_KEY_PEM_BASE64 }}
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (iOS 26 SDK or later)
        run: |
          set -euo pipefail
          chosen=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode_27*.app /Applications/Xcode_28*.app; do
            [ -d "$app" ] || continue
            chosen="$app"
          done
          if [ -z "$chosen" ]; then
            for app in $(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V); do
              v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || echo 0)"
              major="${v%%.*}"
              if [ -n "$major" ] && [ "$major" -ge 26 ] 2>/dev/null; then
                chosen="$app"
              fi
            done
          fi
          if [ -z "$chosen" ]; then
            echo "::error::No Xcode 26+ found on this runner."
            ls -1d /Applications/Xcode*.app 2>/dev/null
            exit 1
          fi
          echo "Selecting $chosen"
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Validate required secrets
        run: |
          set -euo pipefail
          required=(
            IOS_DIST_CERT_PASSWORD
            IOS_APPSTORE_PROFILE_BASE64
            APPLE_TEAM_ID
            APPSTORE_CONNECT_KEY_ID
            APPSTORE_CONNECT_ISSUER_ID
            APPSTORE_CONNECT_API_KEY_P8_BASE64
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
          if [ -z "${IOS_DIST_CERT_P12_BASE64:-}" ]; then
            if [ -z "${IOS_DIST_CERT_CER_BASE64:-}" ] || [ -z "${IOS_DIST_PRIVATE_KEY_PEM_BASE64:-}" ]; then
              echo "Provide either IOS_DIST_CERT_P12_BASE64, or both IOS_DIST_CERT_CER_BASE64 and IOS_DIST_PRIVATE_KEY_PEM_BASE64"
              exit 1
            fi
          fi

      - name: Normalize App Store Connect IDs
        run: |
          set -euo pipefail
          ASC_KEY_ID="$(printf '%s' "${APPSTORE_CONNECT_KEY_ID:-}" | tr -d '\r\n\t ')"
          ASC_ISSUER_ID="$(printf '%s' "${APPSTORE_CONNECT_ISSUER_ID:-}" | tr -d '\r\n\t ')"
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "App Store Connect key id / issuer id is empty after normalization."
            exit 1
          fi
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor iOS toolchain + assets
        run: npm install --save-dev @capacitor/ios@8 @capacitor/assets@3 @capacitor/splash-screen@8 --no-audit --no-fund

      - name: Prepare webDir (Capacitor uses www/; server.url overrides at runtime)
        run: |
          # ゆっくりエクソソームは Vanilla なので、src/ をそのまま www/ にミラーするだけ。
          node scripts/copy-web-to-www.mjs

      - name: Add/copy iOS platform
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx cap copy ios

      # WKWebView の file input からカメラ/写真ライブラリを開くための権限文言と、
      # 標準 HTTPS / OS 提供の TLS のみなら非免除暗号を使わない宣言（審査・輸出コンプライアンスの手戻り軽減）
      - name: Info.plist privacy permissions + export compliance
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          upsert_plist_string() {
            key="$1"
            value="$2"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$key $value" "$PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$PLIST"
            fi
          }
          # Apple 2026-06-03 リジェクト 5.1.1(ii) 対応:
          # purpose strings は「データの使い道」と「具体例」を必ず含める必要がある。
          # 例: "App needs camera access" は NG。
          # ゆっくりエクソソームでは Today 画面の「ビフォーアフター写真記録」機能で
          # 肌・疲労の変化を可視化するためにカメラ/写真ライブラリを使用する。
          # データはすべて端末内 (IndexedDB) のみに保存し、サーバー送信や第三者共有はしない。
          upsert_plist_string "NSCameraUsageDescription" "肌や目元の状態の変化を記録するため、ビフォーアフター写真を撮影します。例: 今日の肌コンディションを撮影し、1か月後に同じ部位を撮って比較することで、自分のセルフケア習慣の積み上がりを確認できます。撮影された写真はすべてこの端末の内部（IndexedDB）にのみ保存され、サーバーには送信されず、第三者と共有されることもありません。"
          upsert_plist_string "NSPhotoLibraryUsageDescription" "肌や目元の変化記録に既存の写真を活用するため、写真ライブラリから過去のビフォー写真を選択します。例: 先月撮影した目元の写真を選んで取り込み、今日撮影した写真と並べて比較できます。選択された写真はこの端末の内部にのみ保存され、サーバーには送信されません。"
          upsert_plist_string "NSPhotoLibraryAddUsageDescription" "アプリ内で撮影した記録写真をご自身の写真ライブラリにも保存できるようにするため、書き込み権限を使用します。例: クリニックの診察前に、アプリで撮りためたビフォーアフター写真を写真アプリへエクスポートして担当医に見せられます。"
          if /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          fi

      - name: Generate icons + splash
        run: |
          set -euo pipefail
          MASTER="store-assets/appstore/app-icon-1024.png"
          SPLASH_MASTER="store-assets/appstore/splash-2732.png"
          mkdir -p assets store-assets/appstore
          if [ -f "$MASTER" ]; then
            cp "$MASTER" assets/icon-only.png
          else
            # フォールバック: src/icons/icon-512.png を拡大して使う
            if [ -f src/icons/icon-512.png ]; then
              cp src/icons/icon-512.png assets/icon-only.png
              cp src/icons/icon-512.png "$MASTER"
            else
              echo "::error::No icon source found (store-assets/appstore/app-icon-1024.png or src/icons/icon-512.png)"
              exit 1
            fi
          fi
          # スプラッシュのマスターが無いと @capacitor/assets はスプラッシュを生成せず、
          # `cap add ios` が置いた Capacitor デフォルト（青い×ロゴ）がそのまま出荷される。
          # → マスター必須。無ければここでビルドを止める（配信前ゲート）。
          if [ ! -f "$SPLASH_MASTER" ]; then
            echo "::error::$SPLASH_MASTER がありません。Capacitorデフォルトのスプラッシュが出荷されるため中止します。python scripts/icon-gen/make_icons.py --only A で生成して commit してください。"
            exit 1
          fi
          cp "$SPLASH_MASTER" assets/splash.png
          cp "$SPLASH_MASTER" assets/splash-dark.png
          SPLASH_DIR="ios/App/App/Assets.xcassets/Splash.imageset"
          list_referenced() {
            python3 -c 'import json,sys; [print(i["filename"]) for i in json.load(open(sys.argv[1]))["images"] if i.get("filename")]' "$SPLASH_DIR/Contents.json"
          }
          # 生成前に Contents.json が参照する画像（= cap add ios が置いた Capacitor デフォルト）の
          # ハッシュ集合を記録しておく。
          # 注意: @capacitor/assets は旧ファイルを上書きせず「新しいファイル名で書いて
          # Contents.json を差し替える」ため、固定ファイル名のハッシュ比較では検証できない。
          DEFAULT_HASHES="$(list_referenced | while read -r f; do shasum -a 256 "$SPLASH_DIR/$f" | awk '{print $1}'; done | sort -u)"
          npx @capacitor/assets generate --ios --iosProject ios/App --assetPath assets --splashBackgroundColor '#FFFAF3' --splashBackgroundColorDark '#FFFAF3'
          # 直接証拠ゲート: 出荷時に実際に参照される画像（生成後の Contents.json 基準）が
          # 全て存在し、かつ Capacitor デフォルトのハッシュ集合に1つも含まれないことを確認。
          REFERENCED="$(list_referenced)"
          if [ -z "$REFERENCED" ]; then
            echo "::error::生成後の Splash.imageset/Contents.json が画像を参照していません。"
            exit 1
          fi
          echo "$REFERENCED" | while read -r f; do
            if [ ! -f "$SPLASH_DIR/$f" ]; then
              echo "::error::Contents.json が参照する $f が存在しません（壊れた imageset が出荷されるため中止）。"
              exit 1
            fi
            h="$(shasum -a 256 "$SPLASH_DIR/$f" | awk '{print $1}')"
            if printf '%s\n' "$DEFAULT_HASHES" | grep -q "$h"; then
              echo "::error::$f が Capacitor デフォルトのスプラッシュのままです（ブランド素材に差し替わっていないため中止）。"
              exit 1
            fi
            echo "splash OK: $f (sha256: $h)"
          done
          echo "Splash regenerated from $SPLASH_MASTER"

      - name: Force iOS deployment target + iPhone-only device family
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i.bak "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]\\+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" "$PBXPROJ"
            sed -i.bak2 -E 's/TARGETED_DEVICE_FAMILY = "[^"]+";/TARGETED_DEVICE_FAMILY = "1";/g' "$PBXPROJ"
          fi

      - name: Set iOS version (MARKETING) from package.json and build number (CFBundleVersion) from CI
        run: |
          set -euo pipefail
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          PLIST="ios/App/App/Info.plist"
          MARK_VER="$(node -p "require('./package.json').version")"
          sed -i.bak -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $MARK_VER;/g" "$PBX"
          if grep -q "INFOPLIST_KEY_CFBundleShortVersionString" "$PBX"; then
            sed -i.bak2 -E "s/INFOPLIST_KEY_CFBundleShortVersionString = [^;]+;/INFOPLIST_KEY_CFBundleShortVersionString = $MARK_VER;/g" "$PBX"
          fi
          if [ -f "$PLIST" ] && /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARK_VER" "$PLIST"
          fi
          BN="${GITHUB_RUN_NUMBER:-0}"
          if [ "$BN" -le 1 ]; then
            BN="$(date +%s)"
          fi
          sed -i.bak -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BN;/g" "$PBX"
          echo "IOS_BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          mkdir -p build
          {
            echo "MARK_VER=$MARK_VER"
            echo "IOS_BUILD_NUMBER=$BN"
          } > build/ci-release-versions.env

      - name: Install signing certificate
        id: signing
        run: |
          set -euo pipefail
          decode_b64_value() {
            value="$1"
            out_path="$2"
            if printf '%s' "$value" | grep -q "BEGIN .*PRIVATE KEY\|BEGIN CERTIFICATE"; then
              printf '%b' "$(printf '%s' "$value" | sed 's/\\r//g; s/\\n/\\n/g')" > "$out_path"
              return 0
            fi
            cleaned="$(printf '%s' "$value" | tr -d '\r\n\t ')"
            cleaned="$(printf '%s' "$cleaned" | sed -e "s/^'//" -e "s/'$//" -e 's/^\"//' -e 's/\"$//')"
            cleaned="$(printf '%s' "$cleaned" | tr '_-' '/+' | tr -cd 'A-Za-z0-9+/=')"
            case $((${#cleaned} % 4)) in
              2) cleaned="${cleaned}==" ;;
              3) cleaned="${cleaned}=" ;;
              1) cleaned="${cleaned}===" ;;
            esac
            [ -n "$cleaned" ] || return 1
            if printf '%s' "$cleaned" | base64 -D > "$out_path" 2>/dev/null; then return 0; fi
            if printf '%s' "$cleaned" | base64 --decode > "$out_path" 2>/dev/null; then return 0; fi
            if printf '%s' "$cleaned" | openssl base64 -d -A -out "$out_path" 2>/dev/null; then return 0; fi
            return 1
          }
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          CERT_DER_PATH="$RUNNER_TEMP/dist-cert.cer"
          CERT_PEM_PATH="$RUNNER_TEMP/dist-cert.pem"
          KEY_PEM_PATH="$RUNNER_TEMP/dist-key.pem"
          use_split_material=false
          if [ -n "${IOS_DIST_CERT_P12_BASE64:-}" ]; then
            if ! decode_b64_value "$IOS_DIST_CERT_P12_BASE64" "$CERT_PATH"; then
              use_split_material=true
            fi
          else
            use_split_material=true
          fi
          if [ "$use_split_material" = false ] && [ ! -s "$CERT_PATH" ]; then
            use_split_material=true
          fi
          if [ "$use_split_material" = true ]; then
            if [ -z "${IOS_DIST_CERT_CER_BASE64:-}" ] || [ -z "${IOS_DIST_PRIVATE_KEY_PEM_BASE64:-}" ]; then
              echo "Split secrets IOS_DIST_CERT_CER_BASE64 + IOS_DIST_PRIVATE_KEY_PEM_BASE64 required when P12 decode fails."
              exit 1
            fi
            decode_b64_value "$IOS_DIST_CERT_CER_BASE64" "$CERT_DER_PATH" || exit 1
            decode_b64_value "$IOS_DIST_PRIVATE_KEY_PEM_BASE64" "$KEY_PEM_PATH" || exit 1
            if grep -q "BEGIN CERTIFICATE" "$CERT_DER_PATH"; then
              cp "$CERT_DER_PATH" "$CERT_PEM_PATH"
            else
              openssl x509 -inform DER -in "$CERT_DER_PATH" -out "$CERT_PEM_PATH"
            fi
            # ★-legacy は外さない（2026-09-06 に macOS ランナーで実測して確定）。
            #   openssl 3.x の既定の暗号化方式で P12 を作ると、macOS の security が
            #   読めず SecKeychainItemImport: MAC verification failed で落ちる。
            #   ★証明書も秘密鍵もパスワードも正しいのに「パスワードが違う」と見える。
            #   -legacy を付けると "1 identity imported." で通る
            #   （2026-06-23 に成功していた時と同じメッセージ）。
            #   ★2026-07-04 から10回以上連続で失敗していた真因がこれ。
            #   Secrets もワークフローも変えていないのに壊れたのは、
            #   GitHub ランナーの openssl が上がったため。検証は ios-cert-diagnose.yml。
            #   ★正本: web-ios-android/templates/workflows/ios-appstore-release.yml
            #     （キット側は既に対策済みだった。こちらが追従できていなかった）
            openssl pkcs12 -export -macalg sha1 -legacy \
              -inkey "$KEY_PEM_PATH" \
              -in "$CERT_PEM_PATH" \
              -out "$CERT_PATH" \
              -passout "pass:$IOS_DIST_CERT_PASSWORD"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          echo "keychain-path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "keychain-password=$KEYCHAIN_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Install App Store provisioning profile
        id: install_profile
        run: |
          set -euo pipefail
          decode_b64_value() {
            value="$1"
            out_path="$2"
            cleaned="$(printf '%s' "$value" | tr -d '\r\n\t ')"
            cleaned="$(printf '%s' "$cleaned" | sed -e "s/^'//" -e "s/'$//" -e 's/^\"//' -e 's/\"$//')"
            cleaned="$(printf '%s' "$cleaned" | tr '_-' '/+' | tr -cd 'A-Za-z0-9+/=')"
            case $((${#cleaned} % 4)) in
              2) cleaned="${cleaned}==" ;;
              3) cleaned="${cleaned}=" ;;
              1) cleaned="${cleaned}===" ;;
            esac
            [ -n "$cleaned" ] || return 1
            if printf '%s' "$cleaned" | base64 -D > "$out_path" 2>/dev/null; then return 0; fi
            if printf '%s' "$cleaned" | base64 --decode > "$out_path" 2>/dev/null; then return 0; fi
            return 1
          }
          PROFILE_RAW="$RUNNER_TEMP/appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/appstore-profile.plist"
          decode_b64_value "$IOS_APPSTORE_PROFILE_BASE64" "$PROFILE_RAW" || exit 1
          security cms -D -i "$PROFILE_RAW" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          APP_ID_FROM_PROFILE="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          EXPECTED_EXACT="${APPLE_TEAM_ID}.${APP_BUNDLE_ID}"
          EXPECTED_WILDCARD="${APPLE_TEAM_ID}.*"
          if [ "$APP_ID_FROM_PROFILE" != "$EXPECTED_EXACT" ] && [ "$APP_ID_FROM_PROFILE" != "$EXPECTED_WILDCARD" ]; then
            echo "Provisioning profile app id mismatch: got=$APP_ID_FROM_PROFILE expected=$EXPECTED_EXACT or $EXPECTED_WILDCARD"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_RAW" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure App Store Connect API key
        run: |
          set -euo pipefail
          write_normalized_private_key() {
            value="$1"
            out_path="$2"
            raw="$(printf '%b' "$(printf '%s' "$value" | sed 's/\\r//g; s/\\n/\\n/g')")"
            body="$(printf '%s' "$raw" | sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' | tr -d '\r\n\t ' | tr -cd 'A-Za-z0-9+/=')"
            [ -n "$body" ] || return 1
            {
              printf '%s\n' '-----BEGIN PRIVATE KEY-----'
              printf '%s' "$body" | fold -w 64
              printf '\n%s\n' '-----END PRIVATE KEY-----'
            } > "$out_path"
            return 0
          }
          decode_b64_value() {
            value="$1"
            out_path="$2"
            if printf '%s' "$value" | grep -q "BEGIN .*PRIVATE KEY"; then
              if write_normalized_private_key "$value" "$out_path"; then return 0; fi
            fi
            cleaned="$(printf '%s' "$value" | tr -d '\r\n\t ')"
            cleaned="$(printf '%s' "$cleaned" | sed -e "s/^'//" -e "s/'$//" -e 's/^\"//' -e 's/\"$//')"
            cleaned="$(printf '%s' "$cleaned" | tr '_-' '/+' | tr -cd 'A-Za-z0-9+/=')"
            case $((${#cleaned} % 4)) in
              2) cleaned="${cleaned}==" ;;
              3) cleaned="${cleaned}=" ;;
              1) cleaned="${cleaned}===" ;;
            esac
            [ -n "$cleaned" ] || return 1
            if printf '%s' "$cleaned" | base64 -D > "$out_path" 2>/dev/null; then return 0; fi
            if printf '%s' "$cleaned" | base64 --decode > "$out_path" 2>/dev/null; then return 0; fi
            if printf '%s' "$cleaned" | openssl base64 -d -A -out "$out_path" 2>/dev/null; then
              if ! grep -q "BEGIN PRIVATE KEY" "$out_path"; then
                if write_normalized_private_key "$(cat "$out_path")" "$out_path"; then return 0; fi
              fi
              return 0
            fi
            return 1
          }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          decode_b64_value "$APPSTORE_CONNECT_API_KEY_P8_BASE64" "$API_KEY_PATH" || exit 1
          if ! grep -q "BEGIN PRIVATE KEY" "$API_KEY_PATH"; then
            echo "Decoded API key does not look like a .p8 private key."
            exit 1
          fi
          if ! openssl pkey -in "$API_KEY_PATH" -noout >/dev/null 2>&1; then
            echo "Decoded API key is not a valid private key document."
            exit 1
          fi
          chmod 600 "$API_KEY_PATH"

      - name: Build unsigned iOS archive
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source build/ci-release-versions.env
          set +a
          if [ -d ios/App/App.xcworkspace ]; then
            XCODE_FLAG=(-workspace ios/App/App.xcworkspace)
          else
            XCODE_FLAG=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild \
            "${XCODE_FLAG[@]}" \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/${APP_NAME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            "MARKETING_VERSION=$MARK_VER" \
            "CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER" \
            archive

      - name: Export IPA
        id: export_ipa
        run: |
          set -euo pipefail
          mkdir -p build/export
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${{ steps.install_profile.outputs.profile_name }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "build/${APP_NAME}.xcarchive" \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          IPA_PATH="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "IPA was not generated."
            exit 1
          fi
          echo "ipa-path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to App Store Connect
        run: |
          set -euo pipefail
          IPA_PATH="${{ steps.export_ipa.outputs.ipa-path }}"
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool \
              --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" \
              --verbose
          else
            xcrun iTMSTransporter \
              -m upload \
              -assetFile "$IPA_PATH" \
              -apiKey "$ASC_KEY_ID" \
              -apiIssuer "$ASC_ISSUER_ID" \
              -v informational
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-appstore
          path: ${{ steps.export_ipa.outputs.ipa-path }}
          if-no-files-found: error

      - name: Submit App Store version for review
        if: ${{ success() }}
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ env.ASC_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          IOS_SCREENSHOTS_DIR: store-assets/appstore/ios-screenshots
          IOS_REVIEW_CONTACT_PHONE: ${{ secrets.IOS_REVIEW_CONTACT_PHONE }}
        run: node scripts/appstore-submit.mjs
